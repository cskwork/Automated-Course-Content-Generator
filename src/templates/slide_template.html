<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{course_title}} - 디지털 교과서</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .presentation-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .slide-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide {
            background: white;
            width: 90%;
            height: 85%;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 60px;
            display: none;
            overflow-y: auto;
            position: relative;
        }

        .slide.active {
            display: block;
            animation: slideIn 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .slide-title {
            font-size: 2.5rem;
            color: #2d3748;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .slide-subtitle {
            font-size: 1.2rem;
            color: #718096;
            font-weight: 400;
        }

        .slide-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #4a5568;
        }

        .slide-content h1, .slide-content h2, .slide-content h3 {
            color: #2d3748;
            margin: 30px 0 20px 0;
        }

        .slide-content h1 {
            font-size: 2rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .slide-content h2 {
            font-size: 1.6rem;
            color: #667eea;
        }

        .slide-content h3 {
            font-size: 1.3rem;
        }

        .slide-content p {
            margin-bottom: 20px;
        }

        .slide-content ul, .slide-content ol {
            margin: 20px 0;
            padding-left: 30px;
        }

        .slide-content li {
            margin-bottom: 10px;
        }

        .quiz-container {
            background: #f7fafc;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            border-left: 5px solid #667eea;
        }

        .quiz-question {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
        }

        .quiz-options {
            list-style: none;
            padding: 0;
        }

        .quiz-options li {
            background: white;
            margin: 10px 0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
        }

        .quiz-options li:hover {
            background: #edf2f7;
            border-color: #667eea;
            transform: translateX(10px);
        }

        .quiz-options li.correct {
            background: #c6f6d5;
            border-color: #38a169;
        }

        .quiz-options li.incorrect {
            background: #fed7d7;
            border-color: #e53e3e;
        }

        .image-container {
            text-align: center;
            margin: 30px 0;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .image-caption {
            font-size: 0.9rem;
            color: #718096;
            margin-top: 10px;
            font-style: italic;
        }

        .navigation {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #667eea;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:hover {
            background: white;
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .slide-counter {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            color: #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            z-index: 1001;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s ease;
            width: 0%;
        }

        .export-options {
            position: fixed;
            top: 30px;
            left: 30px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .export-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #667eea;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .export-btn:hover {
            background: white;
            transform: translateY(-2px);
        }

        .fullscreen-btn {
            position: fixed;
            top: 30px;
            right: 100px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #667eea;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .fullscreen-btn:hover {
            background: white;
            transform: scale(1.1);
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .slide {
                width: 95%;
                height: 90%;
                padding: 30px 20px;
            }

            .slide-title {
                font-size: 2rem;
            }

            .slide-content {
                font-size: 1rem;
            }

            .navigation {
                bottom: 20px;
            }

            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="export-options">
        <button class="export-btn" onclick="exportToPDF()">PDF로 내보내기</button>
        <button class="export-btn" onclick="exportToPPT()">PPT로 내보내기</button>
    </div>

    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="전체화면">
        <span>⛶</span>
    </button>

    <div class="slide-counter">
        <span id="currentSlide">1</span> / <span id="totalSlides">{{total_slides}}</span>
    </div>

    <div class="presentation-container">
        <div class="slide-container">
            {{slides_content}}
        </div>
    </div>

    <div class="navigation">
        <button class="nav-btn" id="prevBtn" onclick="previousSlide()" title="이전 슬라이드">
            <span>‹</span>
        </button>
        <button class="nav-btn" onclick="toggleAutoPlay()" title="자동 재생" id="playBtn">
            <span>▶</span>
        </button>
        <button class="nav-btn" id="nextBtn" onclick="nextSlide()" title="다음 슬라이드">
            <span>›</span>
        </button>
    </div>

    <script>
        let currentSlideIndex = 0;
        let totalSlides = {{total_slides}};
        let autoPlayInterval = null;
        let isAutoPlaying = false;

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            const currentSlideSpan = document.getElementById('currentSlide');
            const progressFill = document.getElementById('progressFill');
            
            if (index >= totalSlides) index = 0;
            if (index < 0) index = totalSlides - 1;
            
            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
            
            currentSlideIndex = index;
            currentSlideSpan.textContent = index + 1;
            
            // 프로그레스 바 업데이트
            const progress = ((index + 1) / totalSlides) * 100;
            progressFill.style.width = progress + '%';
            
            // 버튼 상태 업데이트
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === totalSlides - 1;
        }

        function nextSlide() {
            if (currentSlideIndex < totalSlides - 1) {
                showSlide(currentSlideIndex + 1);
            }
        }

        function previousSlide() {
            if (currentSlideIndex > 0) {
                showSlide(currentSlideIndex - 1);
            }
        }

        function toggleAutoPlay() {
            const playBtn = document.getElementById('playBtn');
            
            if (isAutoPlaying) {
                clearInterval(autoPlayInterval);
                playBtn.innerHTML = '<span>▶</span>';
                playBtn.title = '자동 재생';
                isAutoPlaying = false;
            } else {
                autoPlayInterval = setInterval(() => {
                    if (currentSlideIndex < totalSlides - 1) {
                        nextSlide();
                    } else {
                        clearInterval(autoPlayInterval);
                        playBtn.innerHTML = '<span>▶</span>';
                        playBtn.title = '자동 재생';
                        isAutoPlaying = false;
                    }
                }, 5000);
                playBtn.innerHTML = '<span>⏸</span>';
                playBtn.title = '일시정지';
                isAutoPlaying = true;
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function exportToPDF() {
            window.print();
        }

        function exportToPPT() {
            // PowerPoint 형식으로 내보내기 (향후 구현)
            alert('PPT 내보내기 기능은 곧 추가될 예정입니다.');
        }

        // 키보드 이벤트 처리
        document.addEventListener('keydown', (event) => {
            switch(event.key) {
                case 'ArrowRight':
                case ' ':
                    event.preventDefault();
                    nextSlide();
                    break;
                case 'ArrowLeft':
                    event.preventDefault();
                    previousSlide();
                    break;
                case 'Escape':
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
            }
        });

        // 터치 이벤트 처리 (모바일)
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (event) => {
            touchStartX = event.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (event) => {
            touchEndX = event.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    nextSlide(); // 왼쪽으로 스와이프 = 다음 슬라이드
                } else {
                    previousSlide(); // 오른쪽으로 스와이프 = 이전 슬라이드
                }
            }
        }

        // 퀴즈 상호작용
        function selectQuizOption(element, isCorrect) {
            const options = element.parentElement.children;
            Array.from(options).forEach(option => {
                option.style.pointerEvents = 'none';
                if (option === element) {
                    option.classList.add(isCorrect ? 'correct' : 'incorrect');
                } else if (option.dataset.correct === 'true') {
                    option.classList.add('correct');
                }
            });
        }

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            showSlide(0);
        });
    </script>
</body>
</html>
